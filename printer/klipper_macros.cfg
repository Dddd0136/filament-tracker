# Filament tracker - add to your Klipper config (e.g. macros.cfg).
# Requires the gcode_shell_command extension (present on stock Elegoo Neptune 4 firmware).

[gcode_shell_command spool_report]
command: python3 /home/mks/klipper_config/spool_report.py
timeout: 10.
verbose: False

[gcode_macro SPOOL_TEST]
description: Send a test report (does not change spool weight)
gcode:
  RUN_SHELL_COMMAND CMD=spool_report PARAMS="test 1000"
  RESPOND MSG="Spool tracker: test sent, check the History tab"

# Then add these lines to your existing macros:
#
# PRINT_END (before parking / turning heaters off):
#   RUN_SHELL_COMMAND CMD=spool_report PARAMS="done {printer.print_stats.filament_used|round(1)} {printer.print_stats.print_duration|round(0)} {printer.print_stats.total_duration|round(0)} {printer.virtual_sdcard.progress|round(3)}"
#
# CANCEL_PRINT (before parking):
#   RUN_SHELL_COMMAND CMD=spool_report PARAMS="cancelled {printer.print_stats.filament_used|round(1)} {printer.print_stats.print_duration|round(0)} {printer.print_stats.total_duration|round(0)} {printer.virtual_sdcard.progress|round(3)}"
#
# START_PRINT / PRINT_START (optional, re-sends reports queued while offline):
#   RUN_SHELL_COMMAND CMD=spool_report PARAMS="flush"
